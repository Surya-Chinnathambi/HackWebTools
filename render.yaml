# Render configuration for backend deployment
services:
  - type: web
    name: hackwebtools-backend
    env: node
    buildCommand: cd server && npm install
    startCommand: cd server && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: FRONTEND_URL
        value: https://hackingtoolsinfo.netlify.app
